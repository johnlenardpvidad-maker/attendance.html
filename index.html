<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEIDEE CCTV - Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            navy: '#002b66',
                            navydark: '#001a40',
                            orange: '#ff6b00',
                            orangehover: '#e05e00',
                            lightbg: '#f8fafc'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Navigation Header -->
    <header class="bg-brand-navy text-white shadow-lg border-b-4 border-brand-orange sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div>
                    <h1 class="text-base sm:text-xl font-extrabold tracking-tight uppercase text-white leading-tight">
                        LEIDEE CCTV AND NETWORK DATA SOLUTION
                    </h1>
                    <p class="text-xs text-brand-orange font-semibold tracking-wider uppercase">
                        Attendance Terminal & Workforce Portal
                    </p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <div id="liveClock" class="hidden sm:block text-right pr-3 border-r border-slate-600 text-xs text-slate-200">
                    <div id="clockTime" class="font-bold text-sm text-white">--:--:-- --</div>
                    <div id="clockDate" class="text-slate-300">---, --- -- ----</div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full flex-grow">

        <div id="publicView" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Panel: Employee Selection & Clock In/Out -->
            <div class="lg:col-span-5 space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="bg-gradient-to-r from-brand-navy to-brand-navydark p-4 text-white">
                        <h2 class="text-lg font-bold flex items-center gap-2">
                            <i class="fa-solid fa-user-check text-brand-orange"></i> Employee Terminal
                        </h2>
                        <p class="text-xs text-slate-300">Select your name to log attendance.</p>
                    </div>

                    <div class="p-5 space-y-4">
                        <!-- Dropdown Selection -->
                        <div>
                            <label for="employeeSelect" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">
                                Select Employee
                            </label>
                            <select id="employeeSelect" onchange="handleSelectChange()" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg p-3">
                                <option value="">-- Choose Employee Name --</option>
                            </select>
                        </div>

                        <!-- Employee Info Preview -->
                        <div id="empCardPreview" class="hidden bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3 relative overflow-hidden">
                            <div class="absolute top-0 left-0 w-1.5 h-full bg-brand-orange"></div>
                            <div class="flex items-start justify-between gap-2">
                                <div>
                                    <h3 id="previewName" class="font-bold text-slate-900 text-base"></h3>
                                    <span id="previewDept" class="inline-block bg-brand-navy text-white text-xs font-semibold px-2.5 py-0.5 rounded-md mt-1"></span>
                                </div>
                                <span id="previewId" class="text-xs font-mono font-bold bg-slate-200 text-slate-700 px-2 py-1 rounded"></span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="grid grid-cols-2 gap-3 pt-2">
                            <button type="button" onclick="submitAttendance('TIME IN')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md flex items-center justify-center gap-2 text-sm">
                                <i class="fa-solid fa-right-to-bracket"></i> CLOCK IN
                            </button>
                            <button type="button" onclick="submitAttendance('TIME OUT')" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-md flex items-center justify-center gap-2 text-sm">
                                <i class="fa-solid fa-right-from-bracket"></i> CLOCK OUT
                            </button>
                        </div>
                    </div>
                </div>

                <div id="toastNotification" class="hidden p-4 rounded-xl text-xs sm:text-sm font-semibold transition-all shadow-md flex items-center justify-between">
                    <span id="toastText"></span>
                    <i id="toastIcon" class="fa-solid"></i>
                </div>
            </div>

            <!-- Right Panel: Real-Time Attendance Logs -->
            <div class="lg:col-span-7">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-full">
                    <div class="bg-gradient-to-r from-brand-navy to-brand-navydark p-4 text-white flex justify-between items-center">
                        <div>
                            <h2 class="text-lg font-bold flex items-center gap-2">
                                <i class="fa-solid fa-list-check text-brand-orange"></i> Live Attendance History
                            </h2>
                            <p class="text-xs text-slate-300">Live cloud sync from all mobile devices.</p>
                        </div>
                        <span id="logCountBadge" class="bg-brand-orange text-white text-xs font-bold px-3 py-1 rounded-full">0 Entries</span>
                    </div>

                    <div class="overflow-x-auto flex-grow max-h-[480px]">
                        <table class="w-full text-left text-xs text-slate-600">
                            <thead class="bg-slate-100 text-slate-700 uppercase font-bold sticky top-0 border-b border-slate-200">
                                <tr>
                                    <th class="py-3 px-4">Employee</th>
                                    <th class="py-3 px-4">Department</th>
                                    <th class="py-3 px-4">Status</th>
                                    <th class="py-3 px-4 text-right">Timestamp</th>
                                </tr>
                            </thead>
                            <tbody id="publicLogTableBody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- 1. FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBtWJXRvKXnnEJMjc2rsV3o5KJ6bLr69LE",
            authDomain: "leideeattendance.firebaseapp.com",
            databaseURL: "https://leideeattendance-default-rtdb.firebaseio.com",
            projectId: "leideeattendance",
            storageBucket: "leideeattendance.firebasestorage.app",
            messagingSenderId: "618780574237",
            appId: "1:618780574237:web:5d17cedca1d612a67d3cf4"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Default local employee list (fallback)
        let employees = {
            "LEI-2026-001": { id: "LEI-2026-001", name: "John Lenard P. Vidad", dept: "ADMIN" },
            "LEI-2026-002": { id: "LEI-2026-002", name: "Joel R. Vidad", dept: "HEAD TECH" }
        };
        let attendanceLogs = [];
        let selectedEmpId = null;

        window.addEventListener('DOMContentLoaded', () => {
            listenToRealtimeEmployees();
            listenToRealtimeLogs();
            updateClock();
            setInterval(updateClock, 1000);
        });

        // --- 2. FETCH EMPLOYEES FROM FIREBASE IN REALTIME ---
        function listenToRealtimeEmployees() {
            db.ref('registered_employees').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    employees = data; // Syncs registered employees across all phones and office PCs
                }
                populateEmployeeDropdown();
            });
        }

        // --- 3. CLOUD REAL-TIME ATTENDANCE LOGS ---
        function listenToRealtimeLogs() {
            db.ref('attendance_logs').on('value', (snapshot) => {
                const data = snapshot.val();
                attendanceLogs = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        attendanceLogs.unshift(data[key]);
                    });
                }
                renderPublicLogs();
            });
        }

        function submitAttendance(action) {
            if (!selectedEmpId || !employees[selectedEmpId]) {
                showToast('Please select an employee name first.', 'error');
                return;
            }

            const emp = employees[selectedEmpId];
            const now = new Date();
            const timeString = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + 
                              ' ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const logEntry = {
                logId: Date.now(),
                empId: emp.id,
                name: emp.name,
                dept: emp.dept,
                action: action,
                timestamp: timeString
            };

            // Push entry directly to cloud database
            db.ref('attendance_logs/' + logEntry.logId).set(logEntry, (error) => {
                if (error) {
                    showToast('Failed to log attendance to server.', 'error');
                } else {
                    showToast(`${action} saved successfully for ${emp.name}!`, 'success');
                }
            });
        }

        function renderPublicLogs() {
            const tbody = document.getElementById('publicLogTableBody');
            document.getElementById('logCountBadge').textContent = `${attendanceLogs.length} Entries`;

            tbody.innerHTML = attendanceLogs.map(log => `
                <tr class="hover:bg-slate-50 border-b border-slate-100">
                    <td class="py-2.5 px-4 font-semibold text-slate-900">${log.name} <div class="text-[10px] text-slate-400 font-mono">${log.empId}</div></td>
                    <td class="py-2.5 px-4"><span class="bg-slate-100 text-slate-700 text-[10px] px-2 py-0.5 rounded">${log.dept}</span></td>
                    <td class="py-2.5 px-4">
                        <span class="font-bold px-2 py-0.5 rounded text-[10px] ${log.action === 'TIME IN' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                            ${log.action}
                        </span>
                    </td>
                    <td class="py-2.5 px-4 text-right text-slate-500 font-mono text-[11px]">${log.timestamp}</td>
                </tr>
            `).join('');
        }

        function populateEmployeeDropdown() {
            const select = document.getElementById('employeeSelect');
            select.innerHTML = '<option value="">-- Choose Employee Name --</option>';
            Object.values(employees).forEach(emp => {
                const opt = document.createElement('option');
                opt.value = emp.id;
                opt.textContent = `${emp.name} (${emp.dept}) - ${emp.id}`;
                select.appendChild(opt);
            });
        }

        function handleSelectChange() {
            const selectVal = document.getElementById('employeeSelect').value;
            selectedEmpId = selectVal || null;
            displayEmployeeCard(selectedEmpId);
        }

        function displayEmployeeCard(empId) {
            const preview = document.getElementById('empCardPreview');
            if (empId && employees[empId]) {
                const emp = employees[empId];
                document.getElementById('previewName').textContent = emp.name;
                document.getElementById('previewDept').textContent = emp.dept;
                document.getElementById('previewId').textContent = emp.id;
                preview.classList.remove('hidden');
            } else {
                preview.classList.add('hidden');
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastText').textContent = message;
            toast.className = `p-4 rounded-xl text-xs sm:text-sm font-semibold transition-all shadow-md flex items-center justify-between ${type === 'success' ? 'bg-emerald-100 text-emerald-900' : 'bg-rose-100 text-rose-900'}`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3500);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').textContent = now.toLocaleTimeString('en-US', { hour12: true });
            document.getElementById('clockDate').textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        }
    </script>
</body>
</html>
